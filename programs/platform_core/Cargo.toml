[package]
name = "platform_core"
version = "0.1.0"
description = "platform-core — shared RBAC, game registry, fee config, treasury, boost allowlist and default ads for blockchain-games-hub"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "platform_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.1"
# Treasury ATA (associated_token) + withdraw/extension checks for SPL Token and Token-2022 (Q4).
anchor-spl = "1.2.1"

[dev-dependencies]
# LiteSVM 0.17 = agave 4.3 runtime — matches cargo-build-sbf 4.3.0 (SBPF v3).
# The template's 0.10 (agave 3.1) cannot load our .so (InvalidAccountData).
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
sha2 = "0.11.0"
# TEST ONLY consumer (client builders for its instructions; its .so is built separately).
mock_consumer = { path = "../../tests/mock-consumer", features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
